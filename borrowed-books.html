<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My Borrowed Books</title>
        <link rel="stylesheet" href="dashboard.css">

    </head>

    <body>
        <header class="title">

            <h1>Library Management System</h1>
            <a href="login.html" class="logout-button">Logout</a>

        </header>

        <main class="dashboard">
            <a href="member.html" class="back-link">&larr; Back to Dashboard</a>

            <h2>My Borrowed Books</h2>

            <p class="welcome-text">View and return the books borrowed on your account.</p>

            <div class="dashboard-card add-book-form">

                <label for="member-email">Email</label>
                <input type="email" id="member-email" placeholder="Enter your email">
                <button class="book-button" id="check-borrowed-books">
                    View Borrowed Books
                </button>

            </div>

            <div class="dashboard-grid" id="borrowed-book-list"></div>

        </main>

        <script src="borrowed-books.js"></script>
    </body>
</html>
