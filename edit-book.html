<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Edit Book</title>
        <link rel="stylesheet" href="dashboard.css">

    </head>

    <body>
        <header class="title">

            <h1>Library Management System</h1>
            <a href="login.html" class="logout-button">Logout</a>

        </header>

        <main class="dashboard">
            <a href="manage-books.html" class="back-link">&larr; Back to Manage Books</a>
            <h2>Edit Book</h2>

            <p class="welcome-text">Choose a book and update its information.</p>

            <div class="dashboard-card add-book-form">

                <label for="book-select">Book</label>
                <select id="book-select"></select>

                <label for="title">Title</label>
                <input type="text" id="title">

                <label for="author">Author</label>
                <input type="text" id="author">

                <label for="category">Category</label>
                <input type="text" id="category">

                <button class="book-button" id="save-book-button">Save Changes</button>

                <p id="message"></p>

            </div>

        </main>
        <script src="edit-book.js"></script>
    </body>

</html>
