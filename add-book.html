<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Add Book</title>
        <link rel="stylesheet" href="dashboard.css">

    </head>

    <body>
        <header class="title">

            <h1>Library Management System</h1>
            <a href="login.html" class="logout-button">Logout</a>

        </header>

        <main class="dashboard">
            <a href="admin.html" class="back-link">&larr; Back to Dashboard</a>
            <h2>Add Book</h2>

            <p class="welcome-text">Enter the information for the new book.</p>

            <div class="dashboard-card add-book-form">

                <label for="title">Title</label>
                <input type="text" id="title">

                <label for="author">Author</label>
                <input type="text" id="author">

                <label for="category">Category</label>
                <input type="text" id="category">

                <button class="book-button" id="add-book-button">Add Book</button>

                <p id="message"></p>


            </div>


        </main>
        <script src="add-book.js"></script>
    </body>









</html>
